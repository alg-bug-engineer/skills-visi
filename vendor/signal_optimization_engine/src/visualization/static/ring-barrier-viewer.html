<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ring-Barrier 相位环图可视化</title>
<style>
  :root {
    --bg: #0a1628;
    --card: #0f2040;
    --border: #1e3a5f;
    --accent: #00c8ff;
    --text: #e2e8f0;
    --muted: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
  }
  .header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(90deg, #061020, #0f2a50);
  }
  .header h1 { font-size: 18px; color: var(--accent); margin-bottom: 6px; }
  .header p { font-size: 12px; color: var(--muted); }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: center;
    padding: 14px 24px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
  }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  select {
    min-width: 280px;
    background: #0a1e38;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 13px;
  }
  select:focus { outline: none; border-color: var(--accent); }
  button {
    background: var(--accent);
    color: #00111f;
    border: none;
    border-radius: 6px;
    padding: 9px 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 18px;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .summary {
    padding: 12px 24px;
    color: var(--muted);
    font-size: 13px;
    border-bottom: 1px solid var(--border);
  }
  .main {
    padding: 20px 24px 40px;
    overflow: auto;
  }
  .diagram-wrap {
    background: #fff;
    border-radius: 10px;
    padding: 12px;
    overflow: auto;
  }
  .diagram-wrap svg {
    display: block;
    min-width: 100%;
    height: auto;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .diagram-info {
    margin-top: 12px;
    padding: 12px;
    border-radius: 8px;
    background: #fff7d6;
    color: #1f2937;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    line-height: 1.7;
    white-space: pre-wrap;
  }
  .legend {
    display: flex;
    gap: 14px;
    align-items: center;
    margin-bottom: 8px;
    color: #334155;
    font-size: 12px;
  }
  .legend span {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .swatch {
    width: 14px;
    height: 10px;
    border: 1px solid #111827;
  }
  .empty, .error {
    text-align: center;
    color: var(--muted);
    padding: 80px 20px;
    font-size: 14px;
  }
  .error { color: #f87171; }
  .back { color: var(--accent); text-decoration: none; font-size: 12px; }
</style>
</head>
<body>
  <div class="header">
    <a class="back" href="/debug/">← 返回工具首页</a>
    <h1>Ring-Barrier 相位环图</h1>
    <p>从 signalctl 库读取海信 ODS 配时，选择路口与方案号后展示环图；主相位（环图配置）与跟随相位（跟随配置）分开展示。</p>
  </div>

  <div class="controls">
    <div>
      <label for="intersection">路口</label>
      <select id="intersection" disabled>
        <option value="">加载中…</option>
      </select>
    </div>
    <div>
      <label for="scheme">方案（plan_no / pattern_no）</label>
      <select id="scheme" disabled>
        <option value="">请先选择路口</option>
      </select>
    </div>
    <div>
      <label for="table">数据源</label>
      <select id="table">
        <option value="raw">原始表 raw</option>
        <option value="stage">阶段表 stage</option>
      </select>
    </div>
    <button id="reload" type="button">刷新环图</button>
  </div>

  <div class="summary" id="summary">请选择路口和方案。</div>

  <div class="main">
    <div class="diagram-wrap" id="diagram">
      <div class="empty">选择路口与方案后，环图将显示在此处。</div>
    </div>
  </div>

<script>
const intersectionEl = document.getElementById('intersection');
const schemeEl = document.getElementById('scheme');
const tableEl = document.getElementById('table');
const summaryEl = document.getElementById('summary');
const diagramEl = document.getElementById('diagram');
const reloadBtn = document.getElementById('reload');

const SVG_NS = 'http://www.w3.org/2000/svg';
const COLORS = {
  green: '#4CAF50',
  yellow: '#FFC107',
  red: '#F44336',
  barrier: '#333333',
  text: '#111827',
  muted: '#64748b',
  blue: '#1a237e',
};
const DIRECTION_NAME = {0: '北', 1: '东北', 2: '东', 3: '东南', 4: '南', 5: '西南', 6: '西', 7: '西北'};
const TURN_NAME = {
  '-1': '未知', 11: '直行', 12: '左转', 13: '右转', 14: '直左调头', 15: '右调头',
  16: '左右调头', 17: '直右调头', 18: '左直右调头', 21: '直左混行', 22: '直右混行',
  23: '左右混行', 24: '直左右混行', 31: '掉头', 41: '直行掉头', 42: '左转掉头',
  98: '其他', 99: '其他', 100: '出入口行人', 101: '入口行人', 102: '出口行人',
};

let intersections = [];
let schemes = [];

function tableParam() {
  return encodeURIComponent(tableEl.value || 'raw');
}

function numberValue(value, fallback = 0) {
  const n = Number(value);
  return Number.isFinite(n) ? n : fallback;
}

function escapeText(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[ch]));
}

function createSvgElement(tag, attrs = {}, text = null) {
  const el = document.createElementNS(SVG_NS, tag);
  Object.entries(attrs).forEach(([key, value]) => {
    if (value !== undefined && value !== null) el.setAttribute(key, String(value));
  });
  if (text !== null) el.textContent = text;
  return el;
}

function addSvg(svg, tag, attrs = {}, text = null) {
  const el = createSvgElement(tag, attrs, text);
  svg.appendChild(el);
  return el;
}

function movementToText(movement) {
  const dirCode = Number(movement?.[0]);
  const turnCode = Number(movement?.[1]);
  const dirName = DIRECTION_NAME[dirCode] || `D${dirCode}`;
  const turnName = TURN_NAME[turnCode] || `T${turnCode}`;
  return `${dirName}${turnName}`;
}

function sameMovement(left, right) {
  return Number(left?.[0]) === Number(right?.[0]) && Number(left?.[1]) === Number(right?.[1]);
}

function resolveCycleLen(record) {
  let cycleLen = numberValue(record.cycle_len, 0);
  if (cycleLen > 0) return cycleLen;
  for (const ring of record.rings || []) {
    let total = 0;
    for (const phaseNo of ring.phases || []) {
      const idx = Number(phaseNo) - 1;
      total += numberValue(record.green_times?.[idx]) + numberValue(record.yellow_times?.[idx]) + numberValue(record.red_times?.[idx]);
    }
    cycleLen = Math.max(cycleLen, total);
  }
  return cycleLen;
}

function buildPhaseTimeIntervals(record) {
  const intervals = [];
  (record.rings || []).forEach((ring, ringIdx) => {
    let xPos = 0;
    for (const phaseNoRaw of ring.phases || []) {
      const phaseNo = Number(phaseNoRaw);
      const idx = phaseNo - 1;
      const g = numberValue(record.green_times?.[idx]);
      const y = numberValue(record.yellow_times?.[idx]);
      const r = numberValue(record.red_times?.[idx]);
      const total = g + y + r;
      if (total > 0) {
        intervals.push({
          ring_idx: ringIdx,
          phase_no: phaseNo,
          start: xPos,
          green_end: xPos + g,
          yellow_end: xPos + g + y,
          end: xPos + total,
        });
      }
      xPos += total;
    }
  });
  return intervals;
}

function intervalsOverlap(start1, end1, start2, end2) {
  return start1 < end2 && start2 < end1;
}

function getConcurrentPhasesByInterval(phaseNo, phaseStart, phaseEnd, phaseIntervals, greenOnly = true) {
  const concurrent = new Set([Number(phaseNo)]);
  for (const item of phaseIntervals) {
    const otherStart = item.start;
    const otherEnd = greenOnly ? item.green_end : item.end;
    if (otherEnd > otherStart && intervalsOverlap(phaseStart, phaseEnd, otherStart, otherEnd)) {
      concurrent.add(item.phase_no);
    }
  }
  return concurrent;
}

function getFollowSourceForMovement(phaseNo, movement, followPhaseInfo) {
  for (const item of followPhaseInfo || []) {
    const included = new Set((item.included_phases || []).map(Number));
    if (!included.has(Number(phaseNo))) continue;
    if ((item.direction_info || []).some(candidate => sameMovement(candidate, movement))) return item;
  }
  return null;
}

function shouldSuppressFollowByModifier(followItem, concurrentPhases) {
  const modifier = new Set((followItem?.modifier_phases || []).map(Number));
  for (const phaseNo of concurrentPhases || []) {
    if (modifier.has(Number(phaseNo))) return true;
  }
  return false;
}

function getPhaseMainLabel(phaseNo, record, concurrentPhases) {
  const movements = record.channel_info?.[Number(phaseNo) - 1] || [];
  const labels = [];
  for (const movement of movements) {
    const followItem = getFollowSourceForMovement(phaseNo, movement, record.follow_phase_info || []);
    if (followItem) continue;
    labels.push(movementToText(movement));
  }
  return labels.join('\n');
}

function getPhaseEffectiveMovements(phaseNo, record, concurrentPhases) {
  const movements = record.channel_info?.[Number(phaseNo) - 1] || [];
  return movements.map(movement => {
    const followItem = getFollowSourceForMovement(phaseNo, movement, record.follow_phase_info || []);
    if (!followItem) {
      return { text: movementToText(movement), source: 'normal', suppressed: false, suppressed_by_phases: [] };
    }
    const modifier = new Set((followItem.modifier_phases || []).map(Number));
    const hit = [...concurrentPhases].filter(phase => modifier.has(Number(phase))).sort((a, b) => a - b);
    return {
      text: movementToText(movement),
      source: 'follow',
      follow_no: followItem.follow_phase_no,
      suppressed: hit.length > 0,
      suppressed_by_phases: hit,
    };
  });
}

function phaseIntervalsForNo(phaseNo, phaseIntervals) {
  return phaseIntervals.filter(item => item.phase_no === Number(phaseNo));
}

function isPhaseInGreenAtTime(phaseNo, t, phaseIntervals) {
  return phaseIntervalsForNo(phaseNo, phaseIntervals).some(item => item.start <= t && t < item.green_end);
}

function isPhaseInGreenOrYellowAtTime(phaseNo, t, phaseIntervals) {
  return phaseIntervalsForNo(phaseNo, phaseIntervals).some(item => item.start <= t && t < item.yellow_end);
}

function isModifierSuppressingAtTime(t, followItem, phaseIntervals) {
  return (followItem.modifier_phases || []).some(phaseNo => isPhaseInGreenOrYellowAtTime(phaseNo, t, phaseIntervals));
}

function intervalOnRing(ringIdx, phaseNo, phaseIntervals) {
  return phaseIntervals.find(item => item.ring_idx === ringIdx && item.phase_no === Number(phaseNo)) || null;
}

function includedRunsOnRing(phases, includedPhases) {
  const included = new Set((includedPhases || []).map(Number));
  const runs = [];
  let idx = 0;
  while (idx < phases.length) {
    if (!included.has(Number(phases[idx]))) {
      idx += 1;
      continue;
    }
    let endIdx = idx;
    while (endIdx + 1 < phases.length && included.has(Number(phases[endIdx + 1]))) endIdx += 1;
    runs.push(phases.slice(idx, endIdx + 1).map(Number));
    idx = endIdx + 1;
  }
  return runs;
}

function isInBridgedOrGreenParentAtTime(t, followItem, record, phaseIntervals) {
  const included = (followItem.included_phases || []).map(Number);
  if (included.length === 0) return false;
  if (included.length === 1) return isPhaseInGreenOrYellowAtTime(included[0], t, phaseIntervals);

  for (let ringIdx = 0; ringIdx < (record.rings || []).length; ringIdx += 1) {
    const ring = record.rings[ringIdx];
    for (const run of includedRunsOnRing((ring.phases || []).map(Number), included)) {
      if (run.length >= 2) {
        const first = intervalOnRing(ringIdx, run[0], phaseIntervals);
        const last = intervalOnRing(ringIdx, run[run.length - 1], phaseIntervals);
        if (first && last && first.start <= t && t < last.green_end) return true;
      } else {
        const item = intervalOnRing(ringIdx, run[0], phaseIntervals);
        if (item && item.start <= t && t < item.green_end) return true;
      }
    }
  }
  return included.some(phaseNo => isPhaseInGreenAtTime(phaseNo, t, phaseIntervals));
}

function isFollowPhaseActiveAtTime(t, followItem, phaseIntervals, record) {
  if (isModifierSuppressingAtTime(t, followItem, phaseIntervals)) return false;
  return isInBridgedOrGreenParentAtTime(t, followItem, record, phaseIntervals);
}

function mergeIntervals(intervals) {
  if (!intervals.length) return [];
  const sorted = [...intervals].sort((a, b) => a[0] - b[0]);
  const merged = [sorted[0].slice()];
  for (const [start, end] of sorted.slice(1)) {
    const last = merged[merged.length - 1];
    if (start <= last[1] + 1e-9) last[1] = Math.max(last[1], end);
    else merged.push([start, end]);
  }
  return merged;
}

function buildFollowPhaseActiveIntervals(record, followItem, phaseIntervals, cycleLen) {
  const breakpoints = new Set([0, cycleLen]);
  phaseIntervals.forEach(item => {
    breakpoints.add(item.start);
    breakpoints.add(item.green_end);
    breakpoints.add(item.yellow_end);
    breakpoints.add(item.end);
  });
  const points = [...breakpoints].sort((a, b) => a - b);
  const active = [];
  for (let idx = 0; idx < points.length - 1; idx += 1) {
    const start = points[idx];
    const end = points[idx + 1];
    if (end <= start) continue;
    const midpoint = start + (end - start) / 2;
    if (isFollowPhaseActiveAtTime(midpoint, followItem, phaseIntervals, record)) active.push([start, end]);
  }
  return mergeIntervals(active);
}

function estimateTextWidth(text, fontSize = 11) {
  return [...String(text)].reduce((sum, ch) => sum + (ch.charCodeAt(0) > 127 ? 1.05 : 0.58) * fontSize, 0);
}

function truncateText(text, maxWidth, fontSize = 11) {
  const value = String(text || '').trim();
  if (!value || estimateTextWidth(value, fontSize) <= maxWidth) return value;
  const suffix = '...';
  const suffixWidth = estimateTextWidth(suffix, fontSize);
  let used = 0;
  let out = '';
  for (const ch of value) {
    const w = estimateTextWidth(ch, fontSize);
    if (used + w + suffixWidth > maxWidth) break;
    out += ch;
    used += w;
  }
  return out ? `${out}${suffix}` : '';
}

function wrapPartsToLines(parts, maxWidth, fontSize, maxLines = 2) {
  const cleaned = parts.map(part => String(part).trim()).filter(Boolean);
  const lines = [];
  let current = '';
  for (const part of cleaned) {
    const candidate = current ? `${current} / ${part}` : part;
    if (estimateTextWidth(candidate, fontSize) <= maxWidth) {
      current = candidate;
      continue;
    }
    if (current) lines.push(current);
    current = part;
    if (lines.length >= maxLines) break;
  }
  if (current && lines.length < maxLines) lines.push(current);
  const visibleCount = lines.reduce((sum, line) => sum + line.split(' / ').filter(Boolean).length, 0);
  const hidden = Math.max(cleaned.length - visibleCount, 0);
  if (hidden && lines.length) lines[lines.length - 1] = `${lines[lines.length - 1]} +${hidden}`;
  return lines.map(line => truncateText(line, maxWidth, fontSize)).filter(Boolean);
}

function drawTextLines(svg, lines, x, y, attrs = {}) {
  const fontSize = Number(attrs['font-size'] || 11);
  const text = addSvg(svg, 'text', {
    x, y,
    'text-anchor': attrs.anchor || 'middle',
    'dominant-baseline': 'middle',
    'font-size': fontSize,
    'font-weight': attrs.weight || 'normal',
    fill: attrs.fill || COLORS.text,
  });
  const lineHeight = fontSize * 1.15;
  const offset = -lineHeight * (lines.length - 1) / 2;
  lines.forEach((line, idx) => {
    const tspan = createSvgElement('tspan', {x, dy: idx === 0 ? offset : lineHeight}, line);
    text.appendChild(tspan);
  });
  return text;
}

function drawBar(svg, x, y, width, height, color, label = '', labelColor = COLORS.text) {
  if (width <= 0) return;
  addSvg(svg, 'rect', {x, y, width, height, fill: color, stroke: '#111827', 'stroke-width': 0.8});
  if (label && width >= 14) {
    drawTextLines(svg, [label], x + width / 2, y + height / 2, {'font-size': 10, weight: 'bold', fill: labelColor});
  }
}

function drawAxis(svg, left, top, chartWidth, cycleLen, sectionHeight) {
  const tick = cycleLen <= 90 ? 10 : (cycleLen <= 180 ? 20 : 30);
  for (let t = 0; t <= cycleLen + 0.001; t += tick) {
    const x = left + t * chartWidth / cycleLen;
    addSvg(svg, 'line', {x1: x, y1: top, x2: x, y2: top + sectionHeight, stroke: '#94a3b8', 'stroke-width': 0.7, 'stroke-dasharray': '2 4', opacity: 0.6});
    addSvg(svg, 'text', {x, y: top + sectionHeight + 16, 'text-anchor': 'middle', 'font-size': 10, fill: COLORS.muted}, String(Math.round(t)));
  }
  addSvg(svg, 'text', {x: left + chartWidth / 2, y: top + sectionHeight + 34, 'text-anchor': 'middle', 'font-size': 12, fill: COLORS.text}, '时间 (秒)');
}

function drawMovementHeader(svg, label, x, y, width, fontSize = 10, align = 'center') {
  const parts = String(label || '').split('\n').filter(Boolean);
  const lines = wrapPartsToLines(parts, Math.max(width - 8, 10), fontSize, width >= 52 ? 2 : 1);
  if (!lines.length) return;
  const textX = align === 'start' ? x + 4 : x + width / 2;
  drawTextLines(svg, lines, textX, y, {
    'font-size': fontSize,
    fill: COLORS.blue,
    anchor: align === 'start' ? 'start' : 'middle',
  });
}

function phaseSummaryLines(record, phaseIntervals) {
  const lines = ['channelDim 解析结果:', '说明：环图配置仅显示主相位流向；跟随相位流向在下方「跟随配置」区域单独展示。'];
  (record.channel_info || []).forEach((channels, phaseIdx) => {
    if (!channels || channels.length === 0) return;
    const phaseNo = phaseIdx + 1;
    const current = phaseIntervals.find(item => item.phase_no === phaseNo);
    const concurrent = current
      ? getConcurrentPhasesByInterval(phaseNo, current.start, current.green_end, phaseIntervals, true)
      : new Set([phaseNo]);
    const effective = getPhaseEffectiveMovements(phaseNo, record, concurrent);
    const display = [];
    const suppressed = [];
    effective.forEach(item => {
      if (item.suppressed) {
        const hit = item.suppressed_by_phases?.length ? ` 命中修正相位[${item.suppressed_by_phases.join(',')}]` : '';
        suppressed.push(`随${item.follow_no}:${item.text}${hit}`);
      } else if (item.source === 'follow') {
        display.push(`随${item.follow_no}:${item.text}`);
      } else {
        display.push(item.text);
      }
    });
    const g = numberValue(record.green_times?.[phaseIdx]);
    const concurrentText = [...concurrent].sort((a, b) => a - b).join(',');
    const suppressedText = suppressed.length ? ` | 不显示: ${suppressed.join(', ')}` : '';
    lines.push(`Φ${phaseNo}: 绿${g}s | 并放相位[${concurrentText}] | ${display.join(', ') || '无显示方向'}${suppressedText}`);
  });
  if (record.follow_phase_info?.length) {
    lines.push('', '跟随相位解析结果:');
    record.follow_phase_info.forEach(item => {
      const directions = (item.direction_info || []).map(movementToText).join(', ') || '无方向';
      const included = (item.included_phases || []).join(', ') || '无';
      const modifier = (item.modifier_phases || []).join(', ') || '无';
      lines.push(`跟随相位${item.follow_phase_no}: ${directions} | 母相位[${included}] | 修正相位/不执行于[${modifier}]`);
    });
  }
  return lines;
}

function renderFrontendDiagram(record, selected) {
  const cycleLen = Math.max(resolveCycleLen(record), 1);
  const phaseIntervals = buildPhaseTimeIntervals(record);
  const rings = record.rings || [];
  const followInfo = record.follow_phase_info || [];
  const left = 92;
  const right = 42;
  const chartWidth = Math.max(cycleLen * 7, 920);
  const scale = chartWidth / cycleLen;
  const width = left + chartWidth + right;
  const ringTop = 78;
  const ringPitch = 66;
  const barHeight = 28;
  const ringSectionHeight = Math.max(rings.length * ringPitch - 8, 70);
  const followTop = ringTop + ringSectionHeight + 80;
  const followPitch = 58;
  const followSectionHeight = followInfo.length ? Math.max(followInfo.length * followPitch - 8, 48) : 0;
  const height = followInfo.length ? followTop + followSectionHeight + 58 : ringTop + ringSectionHeight + 58;

  const svg = createSvgElement('svg', {viewBox: `0 0 ${width} ${height}`, width, height, role: 'img', 'aria-label': 'Ring-Barrier 前端 SVG 环图'});
  addSvg(svg, 'rect', {x: 0, y: 0, width, height, fill: '#ffffff'});
  const location = record.cross_name || selected.cross?.name || selected.crossId;
  const offset = record.offset_sec !== null && record.offset_sec !== undefined && record.offset_sec !== '' ? `, 相位差 ${record.offset_sec}s` : '';
  addSvg(svg, 'text', {x: width / 2, y: 24, 'text-anchor': 'middle', 'font-size': 16, 'font-weight': 'bold', fill: COLORS.text}, `环图配置 - 方案${record.pattern || selected.patternNo} @ ${location}`);
  addSvg(svg, 'text', {x: width / 2, y: 45, 'text-anchor': 'middle', 'font-size': 12, fill: '#334155'}, `周期长 ${cycleLen}s${offset}, ${rings.length}环, plan_no=${selected.planNo}, pattern_no=${selected.patternNo}`);

  drawAxis(svg, left, ringTop - 28, chartWidth, cycleLen, ringSectionHeight + 6);

  rings.forEach((ring, ringIdx) => {
    const y = ringTop + ringIdx * ringPitch;
    addSvg(svg, 'text', {x: left - 14, y: y + barHeight / 2, 'text-anchor': 'end', 'dominant-baseline': 'middle', 'font-size': 13, 'font-weight': 'bold', fill: COLORS.text}, `Ring ${ringIdx + 1}`);
    let xPos = 0;
    (ring.phases || []).forEach((phaseNoRaw, phaseIdx) => {
      const phaseNo = Number(phaseNoRaw);
      const idx = phaseNo - 1;
      const g = numberValue(record.green_times?.[idx]);
      const yy = numberValue(record.yellow_times?.[idx]);
      const r = numberValue(record.red_times?.[idx]);
      const total = g + yy + r;
      const x = left + xPos * scale;
      if (total <= 0) return;
      drawBar(svg, x, y, g * scale, barHeight, COLORS.green);
      drawBar(svg, x + g * scale, y, yy * scale, barHeight, COLORS.yellow, yy >= 2 ? String(yy) : '');
      drawBar(svg, x + (g + yy) * scale, y, r * scale, barHeight, COLORS.red, r >= 2 ? String(r) : '', '#ffffff');
      if (g > 0) {
        const concurrent = getConcurrentPhasesByInterval(phaseNo, xPos, xPos + g, phaseIntervals, true);
        drawMovementHeader(svg, getPhaseMainLabel(phaseNo, record, concurrent), x, y - 17, g * scale, 10, 'start');
        addSvg(svg, 'text', {x: x + 6, y: y + barHeight / 2, 'dominant-baseline': 'middle', 'font-size': 11, 'font-weight': 'bold', fill: '#102027'}, `P${phaseNo}`);
        if (g >= 12) drawTextLines(svg, [String(g)], x + g * scale / 2, y + barHeight / 2, {'font-size': 11, weight: 'bold'});
        else if (g >= 6) addSvg(svg, 'text', {x: x + g * scale - 6, y: y + barHeight / 2, 'text-anchor': 'end', 'dominant-baseline': 'middle', 'font-size': 10, 'font-weight': 'bold', fill: COLORS.text}, String(g));
      }
      xPos += total;
      if ((ring.barriers || []).map(Number).includes(phaseIdx)) {
        const barrierX = left + xPos * scale;
        addSvg(svg, 'line', {x1: barrierX, y1: ringTop - 24, x2: barrierX, y2: ringTop + ringSectionHeight - 8, stroke: COLORS.barrier, 'stroke-width': 2, 'stroke-dasharray': '6 5', opacity: 0.75});
      }
    });
  });

  if (followInfo.length) {
    addSvg(svg, 'text', {x: left, y: followTop - 36, 'text-anchor': 'start', 'font-size': 14, 'font-weight': 'bold', fill: COLORS.text}, '跟随配置');
    drawAxis(svg, left, followTop - 24, chartWidth, cycleLen, followSectionHeight + 4);
    followInfo.forEach((item, rowIdx) => {
      const y = followTop + rowIdx * followPitch;
      const activeIntervals = buildFollowPhaseActiveIntervals(record, item, phaseIntervals, cycleLen);
      drawBar(svg, left, y, chartWidth, barHeight, COLORS.red);
      activeIntervals.forEach(([start, end]) => {
        drawBar(svg, left + start * scale, y, (end - start) * scale, barHeight, COLORS.green, end - start >= 10 ? String(Math.round(end - start)) : '');
      });
      const directions = (item.direction_info || []).map(movementToText).join('\n');
      drawMovementHeader(svg, directions, left, y - 15, Math.min(chartWidth * 0.38, 420), 10, 'start');
      const included = (item.included_phases || []).join(',');
      const modifier = (item.modifier_phases || []).join(',');
      const meta = truncateText(`OP${item.follow_phase_no}  母[${included}]  修[${modifier}]`, Math.min(chartWidth * 0.36, 380), 11);
      addSvg(svg, 'text', {x: left + 8, y: y + barHeight / 2, 'dominant-baseline': 'middle', 'font-size': 11, 'font-weight': 'bold', fill: '#1b5e20'}, meta);
    });
  }

  diagramEl.innerHTML = `
    <div class="legend">
      <span><i class="swatch" style="background:${COLORS.green}"></i>绿灯</span>
      <span><i class="swatch" style="background:${COLORS.yellow}"></i>黄灯</span>
      <span><i class="swatch" style="background:${COLORS.red}"></i>全红/禁行</span>
      <span><i class="swatch" style="background:repeating-linear-gradient(90deg, ${COLORS.barrier} 0 6px, transparent 6px 10px)"></i>Barrier</span>
    </div>
  `;
  diagramEl.appendChild(svg);
  const info = document.createElement('div');
  info.className = 'diagram-info';
  info.textContent = phaseSummaryLines(record, phaseIntervals).join('\n');
  diagramEl.appendChild(info);
}

async function loadIntersections() {
  intersectionEl.disabled = true;
  intersectionEl.innerHTML = '<option value="">加载中…</option>';
  schemeEl.innerHTML = '<option value="">请先选择路口</option>';
  schemeEl.disabled = true;
  diagramEl.innerHTML = '<div class="empty">选择路口与方案后，环图将显示在此处。</div>';
  summaryEl.textContent = '正在加载路口列表…';

  const resp = await fetch(`/v1/timing/ring/intersections?table=${tableParam()}`);
  if (!resp.ok) throw new Error(await resp.text());
  intersections = await resp.json();
  intersectionEl.innerHTML = '<option value="">请选择路口</option>';
  intersections.forEach(item => {
    const opt = document.createElement('option');
    opt.value = item.cross_id;
    opt.textContent = `${item.name} (${item.cross_id}, ${item.scheme_count} 条方案)`;
    intersectionEl.appendChild(opt);
  });
  intersectionEl.disabled = false;
  summaryEl.textContent = `共 ${intersections.length} 个路口，请先选择路口。`;
}

async function loadSchemes(crossId) {
  schemeEl.disabled = true;
  schemeEl.innerHTML = '<option value="">加载中…</option>';
  diagramEl.innerHTML = '<div class="empty">请选择方案。</div>';

  const resp = await fetch(`/v1/timing/ring/schemes?cross_id=${encodeURIComponent(crossId)}&table=${tableParam()}`);
  if (!resp.ok) throw new Error(await resp.text());
  schemes = await resp.json();
  schemeEl.innerHTML = '<option value="">请选择方案</option>';
  schemes.forEach(item => {
    const opt = document.createElement('option');
    opt.value = `${item.plan_no}:${item.pattern_no}`;
    opt.textContent = `plan_no=${item.plan_no}, pattern_no=${item.pattern_no} | cycle=${item.cycle_len_sec}s, rings=${item.ring_count}, offset=${item.offset_sec}s`;
    schemeEl.appendChild(opt);
  });
  schemeEl.disabled = schemes.length === 0;
  summaryEl.textContent = schemes.length ? `已加载 ${schemes.length} 条方案，请选择方案号。` : '该路口下暂无方案。';
}

function currentSelection() {
  const crossId = intersectionEl.value;
  const schemeValue = schemeEl.value;
  if (!crossId || !schemeValue) return null;
  const [planNo, patternNo] = schemeValue.split(':').map(Number);
  const cross = intersections.find(item => item.cross_id === crossId);
  const scheme = schemes.find(item => Number(item.plan_no) === planNo && Number(item.pattern_no) === patternNo);
  return {crossId, planNo, patternNo, cross, scheme};
}

async function renderDiagram() {
  const selected = currentSelection();
  if (!selected) {
    summaryEl.textContent = '请先选择路口和方案。';
    return;
  }

  reloadBtn.disabled = true;
  summaryEl.textContent = '正在读取配时数据并前端渲染环图…';
  diagramEl.innerHTML = '<div class="empty">正在渲染 SVG 环图…</div>';

  const url = `/v1/timing/ring/data?cross_id=${encodeURIComponent(selected.crossId)}&plan_no=${selected.planNo}&pattern_no=${selected.patternNo}&table=${tableParam()}&t=${Date.now()}`;
  try {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(await resp.text());
    const record = await resp.json();
    renderFrontendDiagram(record, selected);
    summaryEl.textContent = [
      selected.cross?.name || selected.crossId,
      `plan_no=${selected.planNo}`,
      `pattern_no=${selected.patternNo}`,
      `cycle=${record.cycle_len ?? selected.scheme?.cycle_len_sec}s`,
      `rings=${record.ring_count ?? selected.scheme?.ring_count}`,
      `offset=${record.offset_sec ?? selected.scheme?.offset_sec}s`,
      '前端 SVG 渲染',
    ].join(' | ');
  } catch (err) {
    diagramEl.innerHTML = `<div class="error">环图加载失败：${escapeText(err.message || err)}</div>`;
    summaryEl.textContent = '环图加载失败';
  } finally {
    reloadBtn.disabled = false;
  }
}

intersectionEl.addEventListener('change', async () => {
  const crossId = intersectionEl.value;
  if (!crossId) return;
  try {
    await loadSchemes(crossId);
  } catch (err) {
    summaryEl.textContent = `方案列表加载失败：${err.message || err}`;
  }
});

schemeEl.addEventListener('change', renderDiagram);
reloadBtn.addEventListener('click', renderDiagram);
tableEl.addEventListener('change', async () => {
  try {
    await loadIntersections();
  } catch (err) {
    summaryEl.textContent = `路口列表加载失败：${err.message || err}`;
  }
});

loadIntersections().catch(err => {
  summaryEl.textContent = `路口列表加载失败：${err.message || err}`;
  intersectionEl.innerHTML = '<option value="">加载失败</option>';
});
</script>
</body>
</html>
