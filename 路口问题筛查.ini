路口问题筛查诉求和分析交警关注路口溢流问题，如果发生溢流，会导致直接责任。

溢流有两类：一类是当前路口溢流风险，直接相邻的路口有承接空间，比如排队不长等，这属于点优化；另一类是当前路口溢流风险，直接相邻的路口没有承接空间，比如排队车辆无法顺利通过，甚至发生溢流等，这属于线优化，需要去干线协调治理。

溢流问题的定义：排队长度除以进口道长度。进口道长度的计算逻辑是：adjacent_inter_spacing_m

目的：当前需要获取一个演示数据，用于呈现交通智能体对价值：能够对交警反馈的问题进行诊断分析，吸收一线交警的经验，并给出有效的治理建议，这样的一个业务智能体。

背景：但是当前数据质量存在一些问题，比如数据覆盖不全，数据可能存在错误等，而且数据窗口周期有限。

在这种情况下，需要通过数据分析，找出一些典型的溢流问题路口。按照严格的口径，比如交警反馈的时间段、窗口、进口道和转向等，进行数据筛选，可能无法找到典型路口。

为了分析溢流发生的路口，需要进行上游和下游流量溯源，而目前流量溯源数据有限，且只划分了早高峰、晚高峰和平峰，甚至只有早高峰，且只有一天的数据，所以不能严格按照逻辑进行匹配，更多是为了跑通整个逻辑闭环。

路口所在的干线等级，会影响分析的口径，比如大路上一般是高饱和度，车流比较大，对于小路上，如果发生低饱和度，高排队情况，那么就是可能有非流量问题，比如违停、事故、公交停靠、渠化不合理、机非冲突、施工等需要交通管理的治理可能非简单的信控调节。

路口的渠化会影响流量的分配，比如直行+左转同放行，如果加直行的绿灯，那么左转对应的直接下游道路可能会发生溢流，由于流量的增加。

在生成治理建议的时候，考虑点优化，是生成配时方案，所以路口是否具备配时信息也是一个关键点。

溢流主要关注的指标是溢流风险，次要指标是饱和度，另外关于绿灯利用率、失衡系数、绿信比等，都是诊断参考指标，能够辅助定位可能的原因。

所以，现在的首要目标是，对数据库已有的部分数据进行分析排查，检查可能存在的溢流问题的典型路口。能够支撑完整的智能体逻辑，

数据库的 PostgreSQL 连接信息从项目根目录 `.env` 的 `PG_DSN` 读取，禁止在文档或代码中写入明文凭据。

对数据库已有数据进行扫描，查找可能存在的典型路口，可能的分析指标：
排队长度、进口道长度、饱和度、绿灯利用率、失衡系数、配时方案、流量、道路等级、路口渠化、延误指数、速度等等一系列的指标

任务是：通过对数据库进行扫描分析，结合上述的逻辑，给出点治理和线治理的典型路口推荐；

先验知识：通过配时方案过滤，对于不存在配时方案的路口直接过滤掉。


```sql
WITH direction_spacing AS (
    -- 步骤 1：按照相邻间距逻辑，计算每个路口每个进口方向上的主 SLink 物理全长 (相邻路口间距)
    SELECT
        w.inter_id,
        (CAST(w.dir8_code AS INTEGER) + 1) AS eight_direction, -- 核心对齐：将拓扑 0~7 转换为高德 1~8 编码
        MIN(l.length_m) AS adjacent_inter_spacing_m
    FROM road6.dwd_tfc_rltn_wide_inter_ft_link w
    JOIN road6.dim_link_info l
      ON w.link_id = l.link_id
     AND l.version_id = w.version_id
    WHERE LOWER(w.link_role) = 'entrance'   -- 仅统计进口方向 (entrance)
    GROUP BY w.inter_id, w.dir8_code
    HAVING MIN(l.length_m) >= 50.0           -- 过滤低于 50 米的微短相邻路口/路段（排除非正常区间）
)

SELECT
    DATE(dtaidp5m.stat_time) AS "统计日期",
    di.inter_name AS "路口名称",
    dtaidp5m.inter_id AS "路口ID",
    CASE dtaidp5m.eight_direction
        WHEN 1 THEN '由北向南'
        WHEN 2 THEN '由东北向西南'
        WHEN 3 THEN '由东向西'
        WHEN 4 THEN '由东南向西北'
        WHEN 5 THEN '由南向北'
        WHEN 6 THEN '由西南向东北'
        WHEN 7 THEN '由西向东'
        WHEN 8 THEN '由西北向东南'
    END AS "进口方向",
    CASE dtaidp5m.turn_dir_no
        WHEN 1 THEN '左转（含掉头）'
        WHEN 2 THEN '直行（含掉头）'
        WHEN 3 THEN '右转（含掉头）'
    END AS "转向",
    dtaidp5m.stat_time AS "统计时间",
    dtaidp5m.queue_len_avg AS "平均排队长度（米）",
    ds.adjacent_inter_spacing_m AS "相邻路口间距（米）",
    (ds.adjacent_inter_spacing_m * 0.8) AS "溢流风险排队阈值（米）",
    -- 溢流风险：排队长度 / 真实的红绿灯间距
    dtaidp5m.queue_len_avg / ds.adjacent_inter_spacing_m AS "溢流风险比例"
FROM xianchang.dwd_tfc_inter_dir_perf_5min dtaidp5m -- 直接读取 DB2 本地的标准高德时序明细表
JOIN direction_spacing ds
  ON dtaidp5m.inter_id = ds.inter_id
 AND dtaidp5m.eight_direction = ds.eight_direction
-- 关联路口静态维表以提取中文路口名称
LEFT JOIN road6.dim_inter_info di
  ON dtaidp5m.inter_id = di.inter_id
 AND di.version_id = '20260501' -- 绑定当前激活的静态路网版本
WHERE dtaidp5m.stat_time >= '2026-06-22' AND dtaidp5m.stat_time < '2026-07-06'
  AND dtaidp5m.turn_dir_no != 0 -- 排除方向聚合行
  AND dtaidp5m.is_deleted = 0   -- 排除已逻辑删除的数据
  -- 核心过滤：只筛选出排队长度真实超过区间物理间距 80% 的记录
  AND dtaidp5m.queue_len_avg > (ds.adjacent_inter_spacing_m * 0.8)
ORDER BY "统计日期", "溢流风险比例" DESC;
```
