  if (n.is_topo_anchor && (n.path_coverage == null || n.path_coverage === 0)) return '拓扑';
  if (n.path_coverage != null && n.path_coverage > 0) return `${n.path_coverage}%`;
  return '—';
}

function formatCovHud(n) {
  if (n.role === 'target') return '<span class="cov">目标</span>';
  if (n.path_coverage != null && n.path_coverage > 0) return `<span class="cov">${n.path_coverage}%</span>`;
  if (n.is_topo_anchor) return '<span class="cov" style="color:#94a3b8">拓扑</span>';
  return '<span class="cov">—</span>';
}

function peerRole() {
  return traceMode === 'UPSTREAM' ? 'upstream' : 'downstream';
}

function datasetKey(dir8, turn) {
  return `${traceMode}:${dir8}:${turn}`;
}

function listKeysForMode(mode) {
  return Object.keys(DATASETS || {}).filter(k => k.startsWith(mode + ':'));
}

function initSelectors() {
  const dirSel = document.getElementById('selDir8');
  dirSel.innerHTML = '';
  for (let i = 0; i < 8; i++) {
    const opt = document.createElement('option');
    opt.value = String(i);
    opt.textContent = DIR8_ENTRY[i];
    dirSel.appendChild(opt);
  }
  if (META && META.default_key) {
    const parts = META.default_key.split(':');
    traceMode = parts[0];
    dirSel.value = parts[1];
    document.getElementById('selTurn').value = parts[2];
  } else {
    dirSel.value = '6';
  }
  updateModeButtons();
}

function updateModeButtons() {
  const up = document.getElementById('btnUpstream');
  const down = document.getElementById('btnDownstream');
  up.className = traceMode === 'UPSTREAM' ? 'active-up' : '';
  down.className = traceMode === 'DOWNSTREAM' ? 'active-down' : '';
  document.getElementById('fMainLabel').textContent =
    traceMode === 'UPSTREAM' ? '主走廊(西向直行链)' : '主走廊(主去向链)';
  document.getElementById('fOtherLabel').textContent =
    traceMode === 'UPSTREAM' ? '其他来向' : '其他去向';
}

function currentData() {
  const dir8 = document.getElementById('selDir8').value;
  const turn = document.getElementById('selTurn').value;
  const key = datasetKey(dir8, turn);
  currentKey = key;
  return (DATASETS || {})[key] || null;
}

function renderHud() {
  const data = currentData();
  const warn = document.getElementById('warn');
  const box = document.getElementById('nodes');
  box.innerHTML = '';
  if (!data) {
    document.getElementById('title').textContent = '流量/去向溯源 · link 嗅探';
    document.getElementById('sub').textContent =
      (META && META.inter_name ? META.inter_name + ' · ' : '') +
      `未找到数据集 ${currentKey}，请运行 export_trace_links_sniff_html.py 导出`;
    document.getElementById('stats').innerHTML = '—';
    warn.hidden = false;
    warn.textContent = `缺少 ${currentKey}，当前可用: ${listKeysForMode(traceMode).join(', ') || '无'}`;
    return;
  }
  warn.hidden = true;
  const dir8 = data.f_dir8_no ?? data.dir8_code;
  const turn = data.turn_dir_no;
  const dirLabel = DIR8_LABELS[dir8] || '';
  const turnLabel = TURN_LABELS[turn] || '';
  const isOutgoing = traceMode === 'DOWNSTREAM' || (data.business_direction === 'outgoing');
  document.getElementById('title').textContent = data.title ||
    `${META?.inter_name || ''} · ${dirLabel}${turnLabel} · ${isOutgoing ? '去向' : '来向'}溯源`;
  document.getElementById('sub').textContent =
    `${isOutgoing ? '去向' : '来向'}溯源表 ${data.source || ''} · f_dir8=${dir8} turn=${turn}` +
    (data.db_trace_type ? ` · db_trace=${data.db_trace_type}` : '') +
    (data.exit_dir8 != null && isOutgoing ? ` · 出口方位=${DIR8_LABELS[data.exit_dir8]}` : '') +
    ` · ${data.period || META?.period || ''}`;
  const s = data.stats || {};
  const peerLabel = isOutgoing ? '去向路口' : '来向路口';
  const mainLabel = s.main_corridor_west_straight ?? s.main_corridor;
  document.getElementById('stats').innerHTML =
    `原始行 ${s.raw_rows ?? '—'} → distinct ${peerLabel} <b>${s.distinct_peers ?? s.distinct_upstream ?? '—'}</b><br/>` +
    `主走廊链 <b>${mainLabel ?? '—'}</b> 个 · 已渲染 <b>${(s.rendered ?? 0) + 1}</b> 路口 · link 共 ` +
    `${(data.intersections || []).reduce((a,n)=>a+(n.links||[]).length,0)} 条` +
    (s.missing_center ? ` · 缺坐标 ${s.missing_center}` : '') +
    (s.topo_one_hop && isOutgoing ? ` · 拓扑一跳 <b>${s.topo_one_hop}</b>` : '') +
    (s.topo_one_hop && !isOutgoing ? ` · 拓扑上一跳 <b>${s.topo_one_hop}</b>` : '') +
    `<br/><span style="color:#94a3b8;font-size:10px">${data.logic || ''}</span>`;
  const sorted = [...(data.intersections || [])].sort((a,b) => (b.path_coverage||999) - (a.path_coverage||999));
  const rolePeer = isOutgoing ? 'downstream' : 'upstream';
  sorted.forEach(n => {
    const el = document.createElement('div');
    el.className = 'node';
    const cov = formatCovHud(n);
    let tag;
    if (n.role === 'target') {
      tag = '<span class="tag target">目标</span>';
    } else if (n.is_topo_anchor) {
      tag = `<span class="tag ${isOutgoing ? 'main-down' : 'main-up'}">拓扑#1</span>`;
    } else if (n.in_main_corridor) {
      tag = `<span class="tag ${isOutgoing ? 'main-down' : 'main-up'}">走廊#${n.corridor_hop||'?'}</span>`;
    } else {
      tag = `<span class="tag ${isOutgoing ? 'other-down' : 'other-up'}">${isOutgoing ? '其他去向' : '其他来向'}</span>`;
    }
    const extra = n.role === rolePeer && n.cor_f_dir8_no != null
      ? ` <span style="color:#64748b">${DIR8_LABELS[n.cor_f_dir8_no]}${TURN_LABELS[n.cor_turn_dir_no]||''}</span>`
      : '';
    el.innerHTML = `${cov} <span class="name">${n.name}</span>${tag}${extra}`;
    el.onclick = () => map && map.setZoomAndCenter(16, n.center);
    box.appendChild(el);
  });
}

function isEntrance(r) { return r==='entrance'||r==='进口'; }

function clearLayers() {
  if (!map) return;
  map.remove(layerGroups.links);
  layerGroups = { main: [], other: [], target: [], links: [] };
}

function buildMap() {
  const data = currentData();
  clearLayers();
  if (!data || !(data.intersections || []).length) {
    if (!map) {
      map = new AMap.Map('map', { zoom: 13, center: [117.11, 36.66], viewMode:'2D', mapStyle:'amap://styles/dark' });
    }
    return;
  }
  const isOutgoing = traceMode === 'DOWNSTREAM';
  const mainColor = isOutgoing ? '#a855f7' : '#f59e0b';
  const otherColor = isOutgoing ? '#06b6d4' : '#3b82f6';
  const center = data.intersections[0].center;
  if (!map) {
    map = new AMap.Map('map', { zoom: 13, center, viewMode:'2D', mapStyle:'amap://styles/dark' });
    ['fMain','fOther','fLinks'].forEach(id => {
      document.getElementById(id).onchange = applyFilter;
    });
  } else {
    map.setCenter(center);
  }
  data.intersections.forEach(n => {
    const isTarget = n.role === 'target';
    const isMain = n.in_main_corridor;
    n.links.forEach(link => {
      const ent = isEntrance(link.link_role);
      const pl = new AMap.Polyline({
        path: link.path,
        strokeColor: isTarget ? '#22c55e' : isMain ? mainColor : otherColor,
        strokeOpacity: ent ? 0.45 : 0.2,
        strokeWeight: ent ? 3 : 2,
        zIndex: isTarget ? 60 : isMain ? 40 : 20,
        extData: { n, link },
      });
      layerGroups.links.push(pl);
      if (isTarget) layerGroups.target.push(pl);
      else if (isMain) layerGroups.main.push(pl);
      else layerGroups.other.push(pl);
    });
    const mk = new AMap.CircleMarker({
      center: n.center, radius: isTarget ? 10 : 6,
      strokeColor: '#fff', strokeWeight: 1.5,
      fillColor: isTarget ? '#22c55e' : isMain ? mainColor : otherColor,
      fillOpacity: 0.9, zIndex: 200,
    });
    layerGroups.links.push(mk);
    if (isTarget) layerGroups.target.push(mk);
    else if (isMain) layerGroups.main.push(mk);
    else layerGroups.other.push(mk);
    if (isTarget || isMain || n.is_topo_anchor || (n.path_coverage != null && n.path_coverage >= 20)) {
      const lb = new AMap.Text({
        text: formatCoverage(n),
        position: n.center, offset: new AMap.Pixel(8,-8),
        style: { background:'rgba(10,16,24,.85)', border:'1px solid #64748b', 'border-radius':'4px', padding:'1px 5px', 'font-size':'10px', color:'#e8eef5' },
        zIndex: 210,
      });
      layerGroups.links.push(lb);
      if (isTarget) layerGroups.target.push(lb);
      else if (isMain) layerGroups.main.push(lb);
      else layerGroups.other.push(lb);
    }
  });
  map.add(layerGroups.links);
  map.setFitView(layerGroups.links, false, [50,50,50,380]);
  applyFilter();
}

function applyFilter() {
  if (!map) return;
  const showMain = document.getElementById('fMain').checked;
  const showOther = document.getElementById('fOther').checked;
  const showLinks = document.getElementById('fLinks').checked;
  [...layerGroups.main, ...layerGroups.other, ...layerGroups.target].forEach(o => map.remove(o));
  let vis = [...layerGroups.target];
  if (showMain) vis = vis.concat(layerGroups.main);
  if (showOther) vis = vis.concat(layerGroups.other);
  if (!showLinks) vis = vis.filter(o => o.CLASS_NAME === 'AMap.CircleMarker' || o.CLASS_NAME === 'AMap.Text');
  map.add(vis);
}

function reload() {
  renderHud();
  buildMap();
}

function bindControls() {
  document.getElementById('btnUpstream').onclick = () => {
    traceMode = 'UPSTREAM';
    updateModeButtons();
    reload();
  };
  document.getElementById('btnDownstream').onclick = () => {
    traceMode = 'DOWNSTREAM';
    updateModeButtons();
    reload();
  };
  document.getElementById('selDir8').onchange = reload;
  document.getElementById('selTurn').onchange = reload;
}

if (typeof DATASETS === 'undefined') {
  const DATASETS = {};
  const META = {};
}
initSelectors();
bindControls();
reload();
</script>
</body>
</html>
